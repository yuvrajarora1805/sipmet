; ==============================================================================
; BABA MILK - AI VOICE AGENT DIALPLAN FOR WHATSAPP CALLS
; Handles WhatsApp voice calls using Sarvam AI (Shreya) & Groq LLM inside Docker
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[whatsapp-calling]
; Pattern matching any incoming phone number (including +91...)
exten => _.,1,NoOp(--- AI WHATSAPP CALL FROM ${CALLERID(num)} TO ${EXTEN} ---)
 same => n,Set(CALL_ID=${CHANNEL(uniqueid)})
 same => n,Answer(500)
 same => n,Wait(1)

 ; Notify backend that call started
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_answered","caller":"${CALLERID(num)}","uniqueid":"${CALL_ID}"}' || true)

 ; 1. Play Shreya's Baba Milk Welcome Greeting
 same => n,Playback(/var/lib/asterisk/sounds/en/baba_welcome)

 ; 2. Conversation loop: Record caller -> AI Reasoning -> Play Shreya Response
 same => n(conversation_loop),NoOp(--- Awaiting customer voice response ---)

 ; Short beep and record caller: max 5s, stops after 1s silence for fast response
 same => n,Playback(/var/lib/asterisk/sounds/en/beep)
 same => n,Record(/var/spool/asterisk/monitor/in_${CALL_ID}.wav,1,5,q)

 ; Run Python AI Agent worker directly inside Asterisk container
 same => n,System(python3 /var/lib/asterisk/agent/ai_order_agent.py ${CALL_ID} "${CALLERID(num)}")

 ; Play back Shreya's generated AI reply
 same => n,Playback(/var/spool/asterisk/monitor/reply_${CALL_ID})
 same => n,Wait(1)

 ; Loop back to listen to next response
 same => n,Goto(conversation_loop)

exten => h,1,NoOp(--- CALL FINISHED: Duration ${CDR(billsec)}s ---)
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_ended","caller":"${CALLERID(num)}","duration":${CDR(billsec)},"uniqueid":"${CALL_ID}"}' || true)
 same => n,System(rm -f /var/spool/asterisk/monitor/in_${CALL_ID}.wav /var/spool/asterisk/monitor/reply_${CALL_ID}.wav /var/spool/asterisk/monitor/temp_${CALL_ID}.wav)

; ==============================================================================
; Outbound WhatsApp Calling Context
; Triggered by call files or originate API
; ==============================================================================
[whatsapp-outbound]
exten => _.,1,NoOp(--- OUTBOUND WHATSAPP CALL ANSWERED BY ${EXTEN} ---)
 same => n,Set(CALL_ID=${CHANNEL(uniqueid)})
 same => n,Answer(500)
 same => n,Wait(1)

 ; Notify backend
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"outbound_answered","number":"${EXTEN}","uniqueid":"${CALL_ID}"}' || true)

 ; Play welcome audio
 same => n,Playback(/var/lib/asterisk/sounds/en/baba_welcome)

 ; Enter AI conversation loop
 same => n(conversation_loop),NoOp(--- Outbound Awaiting customer voice response ---)
 same => n,Playback(/var/lib/asterisk/sounds/en/beep)
 same => n,Record(/var/spool/asterisk/monitor/in_${CALL_ID}.wav,1,5,q)
 same => n,System(python3 /var/lib/asterisk/agent/ai_order_agent.py ${CALL_ID} "${EXTEN}")
 same => n,Playback(/var/spool/asterisk/monitor/reply_${CALL_ID})
 same => n,Wait(1)
 same => n,Goto(conversation_loop)

exten => h,1,NoOp(--- OUTBOUND CALL HUNG UP ---)
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_ended","number":"${EXTEN}","duration":${CDR(billsec)},"uniqueid":"${CALL_ID}"}' || true)
 same => n,System(rm -f /var/spool/asterisk/monitor/in_${CALL_ID}.wav /var/spool/asterisk/monitor/reply_${CALL_ID}.wav /var/spool/asterisk/monitor/temp_${CALL_ID}.wav)

