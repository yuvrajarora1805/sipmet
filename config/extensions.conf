; ==============================================================================
; BABA MILK - AI VOICE AGENT DIALPLAN FOR WHATSAPP CALLS
; Handles WhatsApp voice calls using Sarvam AI (Shreya) & Groq LLM inside Docker
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[whatsapp-calling]
; Pattern matching any incoming phone number (including +91...)
exten => _.,1,NoOp(--- AI WHATSAPP CALL FROM ${CALLERID(num)} TO ${EXTEN} ---)
 same => n,Set(CALL_ID=${CHANNEL(uniqueid)})
 same => n,Answer(500)
 same => n,Wait(1)

 ; Notify backend that call started
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_answered","caller":"${CALLERID(num)}","uniqueid":"${CALL_ID}"}' || true)

 ; 1. Play Shreya's Baba Milk Welcome Greeting
 same => n,Playback(/var/lib/asterisk/sounds/en/baba_welcome)

 ; 2. Conversation loop: Record caller -> AI Reasoning -> Play Shreya Response
 same => n(conversation_loop),NoOp(--- Awaiting customer voice response ---)

 ; Short beep and record caller: max 5s, stops after 1s silence for fast response
 same => n,Playback(/var/lib/asterisk/sounds/en/beep)
 same => n,Record(/var/spool/asterisk/monitor/in_${CALL_ID}.wav,1,5,q)

 ; Run Python AI Agent worker directly inside Asterisk container
 same => n,System(python3 /var/lib/asterisk/agent/ai_order_agent.py ${CALL_ID} "${CALLERID(num)}")

 ; Play back Shreya's generated AI reply
 same => n,Playback(/var/spool/asterisk/monitor/reply_${CALL_ID})
 same => n,Wait(1)

 ; Loop back to listen to next response
 same => n,Goto(conversation_loop)

exten => h,1,NoOp(--- CALL FINISHED: Duration ${CDR(billsec)}s ---)
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_ended","caller":"${CALLERID(num)}","duration":${CDR(billsec)},"uniqueid":"${CALL_ID}"}' || true)
 same => n,System(rm -f /var/spool/asterisk/monitor/in_${CALL_ID}.wav /var/spool/asterisk/monitor/reply_${CALL_ID}.wav /var/spool/asterisk/monitor/temp_${CALL_ID}.wav)

; ==============================================================================
; Outbound WhatsApp Calling & IVR Order Reminder Context
; Triggered by call files or originate API
; Handles personalized dealer audio playback and DTMF keypress (1 = Order, 2 = No Order)
; ==============================================================================
[whatsapp-outbound]
exten => _.,1,NoOp(--- OUTBOUND WHATSAPP REMINDER CALL TO ${EXTEN} ---)
 same => n,Set(CALL_ID=${CHANNEL(uniqueid)})
 same => n,Set(D_ID=${IF($["${DEALER_ID}" != ""]?${DEALER_ID}:"0")})
 same => n,Set(BACKEND_API=${IF($["${BABA_API_URL}" != ""]?${BABA_API_URL}:"https://menu.yarora.dev")})
 same => n,Answer(500)
 same => n,Wait(1)

 ; 1. Notify Baba Milk backend that call is answered (in-progress)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calling/events -H "Content-Type: application/json" -d '{"event":"outbound_answered","number":"${EXTEN}","uniqueid":"${CALL_ID}","dealer_id":"${D_ID}"}' || true)

 ; 2. Play custom dealer audio prompt if provided, else fallback to standard welcome
 same => n,ExecIf($["${AUDIO_FILE}" != ""]?Playback(${AUDIO_FILE}):Playback(/var/lib/asterisk/sounds/en/baba_welcome))
 same => n,Wait(0.5)

 ; 3. Check if this is an IVR reminder call with DTMF mode
 same => n,GotoIf($["${CALL_MODE}" = "ai_conversation"]?ai_flow:ivr_flow)

 ; --- IVR DTMF Mode: Read Keypress (1 = Will Order, 2 = No Order) ---
 same => n(ivr_flow),NoOp(--- PROMPTING DEALER: PRESS 1 FOR ORDER, 2 FOR NO ORDER ---)
 same => n,Read(PRESSED_DIGIT,/var/lib/asterisk/sounds/hi/order_prompt,1,,2,6)

 ; Evaluate DTMF key
 same => n,GotoIf($["${PRESSED_DIGIT}" = "1"]?dealer_will_order:check_no_order)
 same => n(check_no_order),GotoIf($["${PRESSED_DIGIT}" = "2"]?dealer_no_order:ivr_timeout)

 ; Option 1: Will place order
 same => n(dealer_will_order),NoOp(--- DEALER CONFIRMED ORDER (KEY 1) ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"1","call_id":"${CALL_ID}"}' || true)
 same => n,Playback(/var/lib/asterisk/sounds/hi/thankyou_order_noted)
 same => n,Hangup()

 ; Option 2: Will not place order today
 same => n(dealer_no_order),NoOp(--- DEALER CONFIRMED NO ORDER (KEY 2) ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"2","call_id":"${CALL_ID}"}' || true)
 same => n,Playback(/var/lib/asterisk/sounds/hi/thankyou_no_order)
 same => n,Hangup()

 ; Timeout or unrecognized key
 same => n(ivr_timeout),NoOp(--- NO VALID DIGIT PRESSED ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"none","call_id":"${CALL_ID}"}' || true)
 same => n,Playback(/var/lib/asterisk/sounds/hi/no_response_bye)
 same => n,Hangup()

 ; --- AI Conversation Flow (Sarvam AI / Groq LLM) ---
 same => n(ai_flow),NoOp(--- Entering AI conversation loop ---)
 same => n(conversation_loop),Playback(/var/lib/asterisk/sounds/en/beep)
 same => n,Record(/var/spool/asterisk/monitor/in_${CALL_ID}.wav,1,5,q)
 same => n,System(python3 /var/lib/asterisk/agent/ai_order_agent.py ${CALL_ID} "${EXTEN}")
 same => n,Playback(/var/spool/asterisk/monitor/reply_${CALL_ID})
 same => n,Wait(1)
 same => n,Goto(conversation_loop)

exten => h,1,NoOp(--- OUTBOUND CALL HUNG UP ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_ended","number":"${EXTEN}","duration":${CDR(billsec)},"uniqueid":"${CALL_ID}","dealer_id":"${D_ID}"}' || true)
 same => n,System(rm -f /var/spool/asterisk/monitor/in_${CALL_ID}.wav /var/spool/asterisk/monitor/reply_${CALL_ID}.wav /var/spool/asterisk/monitor/temp_${CALL_ID}.wav)


