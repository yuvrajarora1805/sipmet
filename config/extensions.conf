; ==============================================================================
; BABA MILK AUTOMATED SIP TELEPHONY & IVR DIALPLAN
; Production Hardened WhatsApp Calling & DTMF Keypad Response Tracking
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[default]
exten => _.,1,NoOp(Default incoming context)
 same => n,Hangup()

; ==============================================================================
; Outbound WhatsApp Calling & IVR Order Reminder Context
; Handles personalized dealer audio playback and DTMF keypress (1 = Order, 2 = No Order)
; ==============================================================================
[whatsapp-outbound]
exten => _[0-9a-zA-Z_].,1,NoOp(--- OUTBOUND WHATSAPP CALL TO ${EXTEN} ---)
 same => n,Set(CALL_ID=${CHANNEL(uniqueid)})
 same => n,Set(D_ID=${IF($["${CUT(EXTEN,_,2)}" != ""]?${CUT(EXTEN,_,1)}:${IF($["${DEALER_ID}" != ""]?${DEALER_ID}:9)})})
 same => n,Set(TARGET_PHONE=${IF($["${CUT(EXTEN,_,2)}" != ""]?${CUT(EXTEN,_,2)}:${EXTEN})})
 same => n,Set(BACKEND_API=${IF($["${BABA_API_URL}" != ""]?${BABA_API_URL}:"https://menu.yarora.dev")})
 same => n,Answer(500)
 same => n,Wait(1)

 ; 1. Notify Baba Milk backend that call is answered (in-progress)
 same => n,System((wget -q -O - "http://127.0.0.1:5055/api/call-event?dealer_id=${D_ID}&event=outbound_answered" || curl -s -m 3 "http://127.0.0.1:5055/api/call-event?dealer_id=${D_ID}&event=outbound_answered" || curl -s -X POST ${BACKEND_API}/api/calling/events -H "Content-Type: application/json" -d "{\"event\":\"outbound_answered\",\"number\":\"${TARGET_PHONE}\",\"uniqueid\":\"${CALL_ID}\",\"dealer_id\":\"${D_ID}\"}") || true)

 ; 2. Dedicated single prompt audio: personalized dealer audio if available, else clean fallback order prompt
 same => n,Set(PROMPT_AUDIO=${IF($[${STAT(e,/var/lib/asterisk/sounds/en/dealers/dealer_${D_ID}.wav)} = 1]?/var/lib/asterisk/sounds/en/dealers/dealer_${D_ID}:/var/lib/asterisk/sounds/en/order_prompt)})
 same => n,Wait(0.5)

 ; 3. Check if this is an AI conversation call or DTMF IVR
 same => n,GotoIf($["${CALL_MODE}" = "ai_conversation"]?ai_flow:ivr_flow)

 ; --- IVR DTMF Mode: Read Keypress (1 = Will Order, 2 = No Order) directly while playing prompt ---
 same => n(ivr_flow),NoOp(--- PROMPTING DEALER WITH ${PROMPT_AUDIO} ---)
 same => n,Set(PRESSED_DIGIT="")
 same => n,Read(PRESSED_DIGIT,${PROMPT_AUDIO},1,s,1,7)
 same => n,NoOp(--- RAW DTMF RECEIVED FROM DEALER: [${PRESSED_DIGIT}] ---)

 ; Explicitly branch on pressed digit
 same => n,ExecIf($["${PRESSED_DIGIT}" = "1"]?Goto(dealer_will_order))
 same => n,ExecIf($["${PRESSED_DIGIT}" = "2"]?Goto(dealer_no_order))
 same => n,Goto(ivr_timeout)

 ; Option 1: Will place order (Dealer pressed 1)
 same => n(dealer_will_order),NoOp(--- DEALER CONFIRMED ORDER (KEY 1) ---)
 same => n,System((wget -q -O - "http://127.0.0.1:5055/api/dtmf?dealer_id=${D_ID}&digit=1" || curl -s -m 3 "http://127.0.0.1:5055/api/dtmf?dealer_id=${D_ID}&digit=1" || curl -s -m 3 -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"1","call_id":"${CALL_ID}"}') || true)
 same => n,Playback(/var/lib/asterisk/sounds/en/thankyou_order_noted)
 same => n,Wait(1)
 same => n,Hangup()

 ; Option 2: Will not place order today (Dealer pressed 2)
 same => n(dealer_no_order),NoOp(--- DEALER CONFIRMED NO ORDER (KEY 2) ---)
 same => n,System((wget -q -O - "http://127.0.0.1:5055/api/dtmf?dealer_id=${D_ID}&digit=2" || curl -s -m 3 "http://127.0.0.1:5055/api/dtmf?dealer_id=${D_ID}&digit=2" || curl -s -m 3 -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"2","call_id":"${CALL_ID}"}') || true)
 same => n,Playback(/var/lib/asterisk/sounds/en/thankyou_no_order)
 same => n,Wait(1)
 same => n,Hangup()

 ; Timeout or unrecognized key
 same => n(ivr_timeout),NoOp(--- NO VALID DIGIT PRESSED: [${PRESSED_DIGIT}] ---)
 same => n,System((wget -q -O - "http://127.0.0.1:5055/api/dtmf?dealer_id=${D_ID}&digit=no_response" || curl -s -m 3 "http://127.0.0.1:5055/api/dtmf?dealer_id=${D_ID}&digit=no_response") || true)
 same => n,Playback(/var/lib/asterisk/sounds/en/no_response_bye)
 same => n,Wait(1)
 same => n,Hangup()

 ; --- AI Conversation Flow (Sarvam AI / Groq LLM) ---
 same => n(ai_flow),NoOp(--- Entering AI conversation loop ---)
 same => n(conversation_loop),Playback(/var/lib/asterisk/sounds/en/beep)
 same => n,Record(/var/spool/asterisk/monitor/in_${CALL_ID}.wav,1,5,q)
 same => n,System(python3 /var/lib/asterisk/agent/ai_order_agent.py ${CALL_ID} "${EXTEN}")
 same => n,Playback(/var/spool/asterisk/monitor/reply_${CALL_ID})
 same => n,Wait(1)
 same => n,Goto(conversation_loop)

exten => h,1,NoOp(--- OUTBOUND CALL HUNG UP ---)
 same => n,System((wget -q -O - "http://127.0.0.1:5055/api/call-event?dealer_id=${D_ID}&event=call_ended" || curl -s -m 3 "http://127.0.0.1:5055/api/call-event?dealer_id=${D_ID}&event=call_ended" || curl -s -X POST ${BACKEND_API}/api/calling/events -H "Content-Type: application/json" -d "{\"event\":\"call_ended\",\"number\":\"${TARGET_PHONE}\",\"duration\":${CDR(billsec)},\"uniqueid\":\"${CALL_ID}\",\"dealer_id\":\"${D_ID}\"}") || true)
 same => n,System(rm -f /var/spool/asterisk/monitor/in_${CALL_ID}.wav /var/spool/asterisk/monitor/reply_${CALL_ID}.wav /var/spool/asterisk/monitor/temp_${CALL_ID}.wav)
