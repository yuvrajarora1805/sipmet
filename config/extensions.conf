; ==============================================================================
; BABA MILK AUTOMATED SIP TELEPHONY & IVR DIALPLAN
; Production Hardened WhatsApp Calling & DTMF Keypad Response Tracking
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[default]
exten => _.,1,NoOp(Default incoming context)
 same => n,Hangup()

; ==============================================================================
; Outbound WhatsApp Calling & IVR Order Reminder Context
; Handles personalized dealer audio playback and DTMF keypress (1 = Order, 2 = No Order)
; ==============================================================================
[whatsapp-outbound]
exten => _.,1,NoOp(--- OUTBOUND WHATSAPP REMINDER CALL TO ${EXTEN} ---)
 same => n,Set(CALL_ID=${CHANNEL(uniqueid)})
 same => n,Set(D_ID=${IF($["${DEALER_ID}" != ""]?${DEALER_ID}:"0")})
 same => n,Set(BACKEND_API=${IF($["${BABA_API_URL}" != ""]?${BABA_API_URL}:"https://menu.yarora.dev")})
 same => n,Answer(500)
 same => n,Wait(1)

 ; 1. Notify Baba Milk backend that call is answered (in-progress)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calling/events -H "Content-Type: application/json" -d '{"event":"outbound_answered","number":"${EXTEN}","uniqueid":"${CALL_ID}","dealer_id":"${D_ID}"}' || true)

 ; 2. Play personalized dealer voice prompt if file exists, else fallback to standard welcome
 same => n,ExecIf($[${STAT(e,/var/lib/asterisk/sounds/en/dealers/dealer_${D_ID}.wav)} = 1]?Playback(/var/lib/asterisk/sounds/en/dealers/dealer_${D_ID}):Playback(/var/lib/asterisk/sounds/en/baba_welcome))
 same => n,Wait(0.5)

 ; 3. Check if this is an IVR reminder call with DTMF mode
 same => n,GotoIf($["${CALL_MODE}" = "ai_conversation"]?ai_flow:ivr_flow)

 ; --- IVR DTMF Mode: Read Keypress (1 = Will Order, 2 = No Order) ---
 same => n(ivr_flow),NoOp(--- PROMPTING DEALER: PRESS 1 FOR ORDER, 2 FOR NO ORDER ---)
 same => n,Read(PRESSED_DIGIT,/var/lib/asterisk/sounds/en/order_prompt,1,,2,6)

 ; Evaluate DTMF key
 same => n,GotoIf($["${PRESSED_DIGIT}" = "1"]?dealer_will_order:check_no_order)
 same => n(check_no_order),GotoIf($["${PRESSED_DIGIT}" = "2"]?dealer_no_order:ivr_timeout)

 ; Option 1: Will place order (Dealer pressed 1)
 same => n(dealer_will_order),NoOp(--- DEALER CONFIRMED ORDER (KEY 1) ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"1","call_id":"${CALL_ID}"}' || true)
 same => n,Playback(/var/lib/asterisk/sounds/en/thankyou_order_noted)
 same => n,Wait(1)
 same => n,Hangup()

 ; Option 2: Will not place order today (Dealer pressed 2)
 same => n(dealer_no_order),NoOp(--- DEALER CONFIRMED NO ORDER (KEY 2) ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"2","call_id":"${CALL_ID}"}' || true)
 same => n,Playback(/var/lib/asterisk/sounds/en/thankyou_no_order)
 same => n,Wait(1)
 same => n,Hangup()

 ; Timeout or unrecognized key
 same => n(ivr_timeout),NoOp(--- NO VALID DIGIT PRESSED: ${PRESSED_DIGIT} ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calls/dtmf-response/${D_ID} -H "Content-Type: application/json" -d '{"Digits":"${PRESSED_DIGIT}","call_id":"${CALL_ID}"}' || true)
 same => n,Playback(/var/lib/asterisk/sounds/en/no_response_bye)
 same => n,Wait(1)
 same => n,Hangup()

 ; --- AI Conversation Flow (Sarvam AI / Groq LLM) ---
 same => n(ai_flow),NoOp(--- Entering AI conversation loop ---)
 same => n(conversation_loop),Playback(/var/lib/asterisk/sounds/en/beep)
 same => n,Record(/var/spool/asterisk/monitor/in_${CALL_ID}.wav,1,5,q)
 same => n,System(python3 /var/lib/asterisk/agent/ai_order_agent.py ${CALL_ID} "${EXTEN}")
 same => n,Playback(/var/spool/asterisk/monitor/reply_${CALL_ID})
 same => n,Wait(1)
 same => n,Goto(conversation_loop)

exten => h,1,NoOp(--- OUTBOUND CALL HUNG UP ---)
 same => n,System(curl -s -X POST ${BACKEND_API}/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_ended","number":"${EXTEN}","duration":${CDR(billsec)},"uniqueid":"${CALL_ID}","dealer_id":"${D_ID}"}' || true)
 same => n,System(rm -f /var/spool/asterisk/monitor/in_${CALL_ID}.wav /var/spool/asterisk/monitor/reply_${CALL_ID}.wav /var/spool/asterisk/monitor/temp_${CALL_ID}.wav)
