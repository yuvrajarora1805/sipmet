; ==============================================================================
; BABA MILK - EXTENSIONS DIALPLAN FOR WHATSAPP BUSINESS CALLS
; Handles incoming voice calls from WhatsApp
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[whatsapp-calling]
; Pattern matching any incoming phone number dialed from WhatsApp
exten => _+X.,1,NoOp(--- INCOMING WHATSAPP CALL FROM ${CALLERID(num)} TO ${EXTEN} ---)
 same => n,Set(CALL_START_TIME=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
 same => n,Set(CALL_ID=${CHANNEL(uniqueid)})
 same => n,Goto(whatsapp-calling,handler,1)

; Also match without + prefix
exten => _X.,1,Goto(whatsapp-calling,handler,1)

; Main handler
exten => handler,1,NoOp(--- Handling call from ${CALLERID(num)} ---)
 
 ; Answer the call immediately
 same => n,Answer(500)
 
 ; Send event notification to Baba Milk Webhook (optional ARI / cURL trigger)
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_answered","caller":"${CALLERID(num)}","uniqueid":"${CALL_ID}"}' || true)
 
 ; Record the entire call to audio file for quality and AI transcription
 same => n,MixMonitor(/var/spool/asterisk/monitor/wa_${CALL_ID}.wav,b)
 
 ; Play official welcome greeting
 same => n,Wait(1)
 same => n,Playback(demo-congrats) ; You can replace with custom 'babamilk-welcome' audio
 
 ; Keep call open for interactive conversation / AI assistant / IVR
 same => n,Wait(2)
 same => n,Playback(beep)
 same => n,Wait(5)
 
 ; Graceful hangup
 same => n,Hangup()

; Hangup handler
exten => h,1,NoOp(--- WHATSAPP CALL TERMINATED: Duration: ${CDR(billsec)} seconds ---)
 same => n,System(curl -s -X POST http://localhost:5000/api/calling/events -H "Content-Type: application/json" -d '{"event":"call_ended","caller":"${CALLERID(num)}","duration":${CDR(billsec)},"uniqueid":"${CALL_ID}"}' || true)
