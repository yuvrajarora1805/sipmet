; ==============================================================================
; BABA MILK - RTP MEDIA CONFIGURATION
; Maps Docker bridge IPs to public VPS IP for ICE candidate negotiation
; This fixes the "no audio" issue when Asterisk runs in Docker on VPS
; ==============================================================================

[general]
rtpstart=10000
rtpend=20000
rtpchecksums=no
strictrtp=yes
probation=8
icesupport=yes

; CRITICAL: Map all Docker bridge network IPs to the real VPS public IP.
; Without this, Asterisk advertises 172.x.x.x as ICE candidates in the SDP,
; which Meta's WebRTC ICE agent cannot reach, causing DTLS handshake failure
; and resulting in total silence (len -000012 in RTP debug).
[ice_host_candidates]
172.17.0.1 => 72.61.236.190
172.18.0.1 => 72.61.236.190
172.19.0.1 => 72.61.236.190
172.20.0.1 => 72.61.236.190
172.21.0.1 => 72.61.236.190

